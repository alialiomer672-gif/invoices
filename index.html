<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>نظام إدارة فواتير الخضار</title>

<link rel="manifest" href='data:application/manifest+json,{"name":"فواتير الخضار","short_name":"فواتير","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#1e5631","icons":[{"src":"logo.png","sizes":"192x192","type":"image/png"}]}'>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  
  body {
    background: linear-gradient(135deg, #1e5631 0%, #4c9a2a 100%);
    margin: 0;
    padding: 15px;
    min-height: 100vh;
    display: flex;
    flex-direction: column; /* إجبار العناصر على النزول تحت بعضها */
    align-items: center;
  }

  /* الأرشيف */
  .archive-sidebar {
    background: #ffffff;
    width: 100%;
    max-width: 800px; /* نفس عرض الفاتورة */
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    margin-bottom: 20px;
  }
  .archive-sidebar h2 {
    font-size: 18px;
    color: #1e5631;
    margin-top: 0;
    border-bottom: 2px solid #eee;
    padding-bottom: 10px;
    margin-bottom: 15px;
    text-align: center;
  }
  .archive-list { display: flex; flex-direction: column; gap: 10px; }
  .archive-item {
    background: #f8f9fc;
    border: 1px solid #eef0f5;
    border-radius: 8px;
    padding: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .archive-item .info { flex: 1; min-width: 200px; font-size: 13px; color: #333; }
  .archive-item .info .statement-title { display: block; margin-bottom: 4px; color: #1e5631; font-size: 15px; font-weight: 800; }
  .archive-item .info .invoice-details { color: #666; font-size: 12px; margin-bottom: 4px; }
  .archive-item .actions-archive { display: flex; gap: 5px; }
  .btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 6px; cursor: pointer; border: none; font-weight: 700; }
  .btn-edit-archive { background: #e3f2fd; color: #1976d2; }
  .btn-del-archive { background: #ffe5e5; color: #d32f2f; }
  .empty-archive { color: #999; font-size: 13px; text-align: center; }

  /* الفاتورة */
  .invoice-container {
    background: #ffffff;
    width: 100%;
    max-width: 800px;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }

  /* رأس الفاتورة (عمودي دائماً) */
  .invoice-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    border-bottom: 3px solid #d32f2f;
    padding-bottom: 15px;
    margin-bottom: 20px;
  }
  .header-logo img { width: 100%; max-width: 150px; height: auto; margin-bottom: 10px; }
  .header-title h1 { margin: 0 0 5px 0; color: #1e5631; font-size: 26px; font-weight: 800; text-align: center; }
  .header-title h2 { margin: 0; color: #d32f2f; font-size: 20px; font-weight: 700; text-align: center; }

  /* معلومات الفاتورة (عمودي دائماً) */
  .invoice-meta {
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 14px;
    color: #555;
    margin-bottom: 15px;
    background: #f8f9fc;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #eee;
    text-align: center;
  }
  .invoice-meta strong { color: #2c3e50; }

  /* حقل البيان (عمودي دائماً) */
  .invoice-statement-row {
    display: flex;
    flex-direction: column;
    margin-bottom: 20px;
    background: #f4f9f4;
    padding: 12px;
    border-radius: 8px;
    border: 1px dashed #4c9a2a;
  }
  .invoice-statement-row label { font-size: 14px; font-weight: 700; color: #1e5631; margin-bottom: 8px; }
  .invoice-statement-row input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
  .invoice-statement-row input:focus { outline: none; border-color: #4c9a2a; }

  /* حقول الإدخال (عمودي دائماً) */
  .form-row {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
    background: #f8f9fc;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #eef0f5;
  }
  .form-row.editing { background: #fff3e0; border-color: #ff9800; }
  .field { width: 100%; display: flex; flex-direction: column; }
  label { display: block; margin-bottom: 6px; font-size: 14px; color: #333; font-weight: 700; }
  input[type="text"], input[type="number"] {
    width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; background: #fff;
  }
  input[type="text"]:focus, input[type="number"]:focus { outline: none; border-color: #4c9a2a; box-shadow: 0 0 0 3px rgba(76, 154, 42, 0.15); }
  
  button { width: 100%; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 700; transition: all 0.2s; }
  .btn-add { background: #4c9a2a; color: #fff; }
  .btn-update { background: #ff9800; color: #fff; }
  .btn-cancel-edit { background: #95a5a6; color: #fff; }

  /* اقتراحات الأصناف */
  .suggestions {
    position: absolute; top: 100%; right: 0; left: 0; background: #fff; border: 1px solid #ddd; border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15); max-height: 200px; overflow-y: auto; z-index: 100; display: none; margin-top: 4px;
  }
  .suggestions.show { display: block; }
  .suggestion-item { padding: 12px; cursor: pointer; font-size: 15px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
  .suggestion-item:hover, .suggestion-item.active { background: #f0f7ec; }
  .suggestion-item .price-tag { font-size: 13px; color: #4c9a2a; font-weight: 600; }
  .suggestions .no-result { padding: 12px; text-align: center; color: #999; font-size: 14px; }

  /* الجدول */
  .table-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #fff; min-width: 400px; }
  th, td { padding: 10px; text-align: center; border-bottom: 1px solid #eef0f5; font-size: 14px; }
  th { background: #1e5631; color: #fff; font-weight: 700; }
  tbody tr:nth-child(even) { background: #fafbff; }
  .empty { text-align: center; color: #999; padding: 25px; font-style: italic; }
  .btn-del { background: #ffe5e5; color: #d32f2f; padding: 6px 10px; font-size: 13px; width: auto; }
  .btn-edit { background: #e3f2fd; color: #1976d2; padding: 6px 10px; font-size: 13px; width: auto; }

  /* الإجماليات */
  .totals { margin-top: 20px; display: flex; justify-content: center; }
  .totals-box { width: 100%; background: #f4f9f4; border-radius: 12px; padding: 15px; border: 1px solid #c4dfb7; }
  .totals-row.grand { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; color: #d32f2f; }

  /* أزرار التحكم النهائية */
  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; padding-top: 20px; border-top: 1px dashed #ddd; }
  .btn-save-main { background: #27ae60; color: #fff; }
  .btn-print { background: #d32f2f; color: #fff; }

  /* الطباعة */
  @media print {
    body { background: #fff !important; padding: 0; display: block; }
    .archive-sidebar, .no-print, .form-row, .invoice-statement-row, .actions, .suggestions, th:last-child, td:last-child { display: none !important; }
    .invoice-container { box-shadow: none; border-radius: 0; padding: 0; max-width: 100%; }
    .invoice-header { border-bottom: 2px solid #000; padding-bottom: 5px; margin-bottom: 10px; }
    .header-logo img { max-width: 100px; }
    .header-title h1 { font-size: 20px; color: #000; }
    .header-title h2 { font-size: 14px; color: #333; }
    .invoice-meta { flex-direction: row !important; justify-content: space-between; font-size: 11px; padding: 5px; }
    .statement-print-text { display: block !important; font-size: 12px; margin-bottom: 10px; }
    th, td { padding: 5px; font-size: 11px; border: 1px solid #ccc; }
    th { background: #f0f0f0 !important; color: #000; }
    .totals { justify-content: flex-end; }
    .totals-box { width: 50%; border: 1px solid #ccc; }
  }
</style>
</head>
<body>

  <!-- الأرشيف (فوق الفاتورة) -->
  <div class="archive-sidebar no-print">
    <h2>📁 فواتير الـ 12 ساعة</h2>
    <div class="archive-list" id="archiveList">
      <div class="empty-archive">لا توجد فواتير محفوظة حالياً</div>
    </div>
  </div>

  <!-- الفاتورة (تحت الأرشيف) -->
  <div class="invoice-container">
    <!-- الرأس -->
    <div class="invoice-header">
      <div class="header-logo">
        <img src="logo.png" alt="شعار" onerror="this.style.display='none'">
      </div>
      <div class="header-title">
        <h1>فواتير مشتريات</h1>
        <h2>الخضار</h2>
      </div>
    </div>

    <!-- معلومات الفاتورة -->
    <div class="invoice-meta">
      <div><strong>رقم الفاتورة:</strong> <span id="invoiceNo"></span></div>
      <div><strong>التاريخ:</strong> <span id="invoiceDate"></span></div>
    </div>

    <!-- البيان -->
    <div class="invoice-statement-row no-print" id="statementRow">
      <label>البيان:</label>
      <input type="text" id="invoiceStatement" placeholder="اكتب بيان الفاتورة..." autocomplete="off">
    </div>
    <div class="statement-print-text" id="statementPrintBox" style="display:none;">
      <strong>البيان:</strong> <span id="statementPrintText"></span>
    </div>

    <!-- إدخال الأصناف -->
    <div class="form-row no-print" id="formRow">
      <div class="field">
        <label>اسم الصنف</label>
        <input type="text" id="itemName" placeholder="اسم الصنف..." autocomplete="off">
        <div class="suggestions" id="suggestions"></div>
      </div>
      <div class="field">
        <label>الكمية</label>
        <input type="number" id="itemQty" min="1" value="1">
      </div>
      <div class="field">
        <label>سعر الوحدة</label>
        <input type="number" id="itemPrice" min="0" step="0.01" placeholder="0.00">
      </div>
      <button class="btn-add" id="btnSubmit" onclick="submitItem()">➕ إضافة صنف</button>
      <button class="btn-cancel-edit" id="btnCancelEdit" onclick="cancelEdit()" style="display: none;">إلغاء التعديل</button>
    </div>

    <!-- الجدول -->
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>اسم الصنف</th>
            <th>الكمية</th>
            <th>سعر الوحدة</th>
            <th>الإجمالي</th>
            <th class="no-print">إجراءات</th>
          </tr>
        </thead>
        <tbody id="itemsBody">
          <tr><td colspan="6" class="empty">لا توجد أصناف بعد</td></tr>
        </tbody>
      </table>
    </div>

    <!-- الإجمالي -->
    <div class="totals">
      <div class="totals-box">
        <div class="totals-row grand">
          <span>الإجمالي النهائي:</span>
          <span id="grandTotal">0.00 ر.س</span>
        </div>
      </div>
    </div>

    <!-- الأزرار -->
    <div class="actions no-print">
      <button class="btn-save-main" onclick="saveAndCreateNew()">💾 حفظ الفاتورة وبدء واحدة جديدة</button>
      <button class="btn-print" onclick="printCurrentInvoice()">🖨 طباعة / PDF</button>
    </div>
  </div>

<script>
  const EXPIRATION_TIME = 12 * 60 * 60 * 1000; 
  let savedItems = JSON.parse(localStorage.getItem('savedItems') || '{}');
  
  function cleanOldInvoices() {
    let allInvoices = JSON.parse(localStorage.getItem('allInvoices') || '[]');
    const now = Date.now();
    const validInvoices = allInvoices.filter(inv => (now - inv.savedAt) < EXPIRATION_TIME);
    if (validInvoices.length !== allInvoices.length) {
      localStorage.setItem('allInvoices', JSON.stringify(validInvoices));
    }
    return validInvoices;
  }

  let allInvoices = cleanOldInvoices(); 
  let currentItems = [];
  let currentInvoiceNo = '';
  let currentInvoiceDate = '';
  let editIndex = -1;

  const nameInput = document.getElementById('itemName');
  const qtyInput = document.getElementById('itemQty');
  const priceInput = document.getElementById('itemPrice');
  const suggestionsBox = document.getElementById('suggestions');
  const formRow = document.getElementById('formRow');
  const btnSubmit = document.getElementById('btnSubmit');
  const btnCancelEdit = document.getElementById('btnCancelEdit');
  let activeIndex = -1;

  function generateInvoiceNo() { return 'INV-' + Date.now().toString().slice(-6); }

  function initNewInvoice() {
    currentInvoiceNo = generateInvoiceNo();
    currentInvoiceDate = new Date().toLocaleDateString('ar-SA');
    document.getElementById('invoiceNo').textContent = currentInvoiceNo;
    document.getElementById('invoiceDate').textContent = currentInvoiceDate;
    document.getElementById('invoiceStatement').value = '';
    currentItems = [];
    cancelEdit();
    render();
    nameInput.focus();
    window.scrollTo(0, 0);
  }

  function saveAndCreateNew() {
    if (currentItems.length === 0) { alert('الفاتورة فارغة! يرجى إضافة أصناف أولاً.'); return; }
    const statementVal = document.getElementById('invoiceStatement').value.trim();
    allInvoices = cleanOldInvoices();
    const existingIndex = allInvoices.findIndex(inv => inv.invoiceNo === currentInvoiceNo);
    const invoiceData = { invoiceNo: currentInvoiceNo, date: currentInvoiceDate, savedAt: Date.now(), statement: statementVal, items: [...currentItems] };
    if (existingIndex > -1) { allInvoices[existingIndex] = invoiceData; } else { allInvoices.push(invoiceData); }
    localStorage.setItem('allInvoices', JSON.stringify(allInvoices));
    renderArchive();
    alert('تم حفظ الفاتورة بنجاح (ستُحذف تلقائياً بعد 12 ساعة).');
    initNewInvoice();
  }

  function loadInvoice(index) {
    if (!confirm('هل تريد فتح هذه الفاتورة للتعديل؟ سيتم مسح الفاتورة الحالية إذا كانت غير محفوظة.')) return;
    const inv = allInvoices[index];
    currentInvoiceNo = inv.invoiceNo;
    currentInvoiceDate = inv.date;
    currentItems = [...inv.items];
    document.getElementById('invoiceNo').textContent = currentInvoiceNo;
    document.getElementById('invoiceDate').textContent = currentInvoiceDate;
    document.getElementById('invoiceStatement').value = inv.statement || '';
    cancelEdit();
    render();
    window.scrollTo(0, 0);
  }

  function deleteInvoice(index) {
    if (!confirm('هل أنت متأكد من حذف هذه الفاتورة نهائياً؟')) return;
    allInvoices.splice(index, 1);
    localStorage.setItem('allInvoices', JSON.stringify(allInvoices));
    renderArchive();
  }

  function renderArchive() {
    const list = document.getElementById('archiveList');
    list.innerHTML = '';
    allInvoices = cleanOldInvoices();
    if (allInvoices.length === 0) {
      list.innerHTML = '<div class="empty-archive">لا توجد فواتير محفوظة حالياً</div>';
      return;
    }
    [...allInvoices].reverse().forEach((inv) => {
      const originalIndex = allInvoices.indexOf(inv);
      const total = inv.items.reduce((sum, item) => sum + (item.qty * item.price), 0);
      const timeElapsed = Date.now() - inv.savedAt;
      const timeLeft = EXPIRATION_TIME - timeElapsed;
      const hoursLeft = Math.max(0, Math.floor(timeLeft / (1000 * 60 * 60)));
      const minsLeft = Math.max(0, Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60)));
      const displayTitle = inv.statement ? inv.statement : 'بدون بيان';
      const div = document.createElement('div');
      div.className = 'archive-item';
      div.innerHTML = `
        <div class="info">
          <span class="statement-title">${displayTitle}</span>
          <div class="invoice-details">${inv.date} | ${total.toFixed(2)} ر.س</div>
          <div style="font-size: 11px; color: #e67e22;">⏳ متبقي: ${hoursLeft}س ${minsLeft}د</div>
        </div>
        <div class="actions-archive">
          <button class="btn-sm btn-edit-archive" onclick="loadInvoice(${originalIndex})">فتح</button>
          <button class="btn-sm btn-del-archive" onclick="deleteInvoice(${originalIndex})">حذف</button>
        </div>
      `;
      list.appendChild(div);
    });
  }

  function editItem(index) {
    editIndex = index;
    const item = currentItems[index];
    nameInput.value = item.name; qtyInput.value = item.qty; priceInput.value = item.price;
    formRow.classList.add('editing');
    btnSubmit.textContent = '✔ تحديث الصنف'; btnSubmit.className = 'btn-update';
    btnCancelEdit.style.display = 'inline-block';
    nameInput.focus();
  }

  function cancelEdit() {
    editIndex = -1;
    nameInput.value = ''; qtyInput.value = 1; priceInput.value = '';
    formRow.classList.remove('editing');
    btnSubmit.textContent = '➕ إضافة صنف'; btnSubmit.className = 'btn-add';
    btnCancelEdit.style.display = 'none';
    nameInput.focus();
  }

  function submitItem() {
    const name  = nameInput.value.trim();
    const qty   = parseFloat(qtyInput.value);
    const price = parseFloat(priceInput.value);
    if (!name) return alert('الرجاء إدخال اسم الصنف');
    if (!qty || qty <= 0) return alert('الرجاء إدخال كمية صحيحة');
    if (isNaN(price) || price < 0) return alert('الرجاء إدخال سعر صحيح');
    if (editIndex === -1) {
      if (currentItems.some(item => item.name === name)) return alert('هذا الصنف موجود بالفعل في الفاتورة! يمكنك تعديله من الجدول.');
    } else {
      if (currentItems.some((item, i) => item.name === name && i !== editIndex)) return alert('يوجد صنف آخر بنفس الاسم في الفاتورة!');
    }
    savedItems[name] = price;
    localStorage.setItem('savedItems', JSON.stringify(savedItems));
    if (editIndex === -1) { currentItems.push({ name, qty, price }); } else { currentItems[editIndex] = { name, qty, price }; }
    cancelEdit(); render();
  }

  function removeItem(index) {
    if (editIndex === index) cancelEdit();
    currentItems.splice(index, 1); render();
  }

  function printCurrentInvoice() {
    if (currentItems.length === 0) { alert('لا توجد أصناف في الفاتورة لطباعتها.'); return; }
    const statementVal = document.getElementById('invoiceStatement').value.trim();
    const printBox = document.getElementById('statementPrintBox');
    const printText = document.getElementById('statementPrintText');
    if (statementVal) { printText.textContent = statementVal; printBox.style.display = 'block'; } else { printBox.style.display = 'none'; }
    window.print();
  }

  function render() {
    const tbody = document.getElementById('itemsBody');
    tbody.innerHTML = '';
    if (currentItems.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty">لا توجد أصناف بعد</td></tr>';
    } else {
      currentItems.forEach((item, i) => {
        const lineTotal = item.qty * item.price;
        tbody.innerHTML += `
          <tr>
            <td>${i + 1}</td><td>${item.name}</td><td>${item.qty}</td><td>${item.price.toFixed(2)}</td><td>${lineTotal.toFixed(2)}</td>
            <td class="no-print" style="white-space: nowrap;">
              <button class="btn-edit" onclick="editItem(${i})">✏ تعديل</button>
              <button class="btn-del" onclick="removeItem(${i})">🗑</button>
            </td>
          </tr>
        `;
      });
    }
    const grand = currentItems.reduce((sum, it) => sum + it.qty * it.price, 0);
    document.getElementById('grandTotal').textContent = grand.toFixed(2) + ' ر.س';
  }

  nameInput.addEventListener('keydown', (e) => {
    const list = suggestionsBox.querySelectorAll('.suggestion-item');
    const isDropdownOpen = suggestionsBox.classList.contains('show') && list.length > 0;
    if (e.key === 'ArrowDown') { if (!isDropdownOpen) return; e.preventDefault(); activeIndex = (activeIndex + 1) % list.length; updateActive(list); } 
    else if (e.key === 'ArrowUp') { if (!isDropdownOpen) return; e.preventDefault(); activeIndex = (activeIndex - 1 + list.length) % list.length; updateActive(list); } 
    else if (e.key === 'Enter') {
      if (isDropdownOpen && activeIndex >= 0) { e.preventDefault(); list[activeIndex].click(); } 
      else { e.preventDefault(); suggestionsBox.classList.remove('show'); qtyInput.focus(); qtyInput.select(); }
    } else if (e.key === 'Escape') { suggestionsBox.classList.remove('show'); }
  });

  qtyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); priceInput.focus(); priceInput.select(); } });
  priceInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submitItem(); } });

  nameInput.addEventListener('input', () => {
    const query = nameInput.value.trim();
    suggestionsBox.innerHTML = ''; activeIndex = -1;
    if (query.length < 1) { suggestionsBox.classList.remove('show'); return; }
    const matches = Object.keys(savedItems).filter(name => name.includes(query)).slice(0, 8);
    if (matches.length === 0) {
      suggestionsBox.innerHTML = '<div class="no-result">لا توجد أصناف محفوظة مطابقة</div>';
      suggestionsBox.classList.add('show'); return;
    }
    matches.forEach(name => {
      const div = document.createElement('div');
      div.className = 'suggestion-item';
      div.innerHTML = `<span>${name}</span><span class="price-tag">${savedItems[name].toFixed(2)} ر.س</span>`;
      div.onclick = () => selectSuggestion(name);
      suggestionsBox.appendChild(div);
    });
    suggestionsBox.classList.add('show');
  });

  function updateActive(list) { list.forEach((el, i) => el.classList.toggle('active', i === activeIndex)); }
  function selectSuggestion(name) {
    nameInput.value = name;
    if (savedItems[name] !== undefined) priceInput.value = savedItems[name];
    suggestionsBox.classList.remove('show');
    qtyInput.focus(); qtyInput.select();
  }

  document.addEventListener('click', (e) => {
    if (!nameInput.contains(e.target) && !suggestionsBox.contains(e.target)) { suggestionsBox.classList.remove('show'); }
  });

  qtyInput.addEventListener('focus', function() { this.select(); });
  priceInput.addEventListener('focus', function() { this.select(); });

  renderArchive();
  initNewInvoice();
  setInterval(() => { renderArchive(); }, 60000); 
</script>

</body>
</html>
