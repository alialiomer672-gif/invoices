<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فواتير مشتريات الخضار</title>

<!-- إعدادات التطبيق (PWA) للاختصار على الشاشة الرئيسية -->
<link rel="manifest" href='data:application/manifest+json,{"name":"فواتير الخضار","short_name":"فواتير","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#1e5631","icons":[{"src":"logo.png","sizes":"192x192","type":"image/png"}]}'>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  
  body {
    /* خلفية ألوان متدرجة (بدون صور) */
    background: linear-gradient(135deg, #1e5631 0%, #4c9a2a 100%);
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }

  .container {
    background: #ffffff; /* جعل الخلفية بيضاء صلبة لتبرز الفاتورة */
    width: 100%;
    max-width: 950px;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    position: relative;
  }

  /* ===== رأس الفاتورة ===== */
  .invoice-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid #d32f2f;
    padding-bottom: 20px;
    margin-bottom: 25px;
    position: relative;
  }

  .header-logo {
    flex: 0 0 180px;
    display: flex;
    justify-content: flex-start;
    z-index: 2;
  }
  .header-logo img {
    width: 100%;
    max-width: 160px;
    height: auto;
    object-fit: contain;
  }

  .header-title {
    flex: 1;
    text-align: center;
    position: absolute;
    left: 0;
    right: 0;
    pointer-events: none;
  }
  
  .header-title h1 {
    margin: 0 0 5px 0;
    color: #1e5631;
    font-size: 38px;
    font-weight: 800;
  }
  .header-title h2 {
    margin: 0;
    color: #d32f2f;
    font-size: 28px;
    font-weight: 700;
  }

  .header-spacer { flex: 0 0 180px; }

  /* معلومات الفاتورة */
  .invoice-meta {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: #555;
    margin-bottom: 10px;
    background: #f8f9fc;
    padding: 10px 15px;
    border-radius: 8px;
    border: 1px solid #eee;
  }
  .invoice-meta strong { color: #2c3e50; }

  /* ===== حقل البيان ===== */
  .invoice-statement-row {
    margin-bottom: 20px;
    background: #f4f9f4;
    padding: 12px 15px;
    border-radius: 8px;
    border: 1px dashed #4c9a2a;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .invoice-statement-row label {
    font-size: 14px;
    font-weight: 700;
    color: #1e5631;
    white-space: nowrap;
  }
  .invoice-statement-row input {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
  }
  .invoice-statement-row input:focus {
    outline: none;
    border-color: #4c9a2a;
  }

  .statement-print-text {
    display: none;
    margin-bottom: 20px;
    padding: 10px;
    background: #fafafa;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 15px;
  }
  .statement-print-text strong { color: #000; }

  /* ===== حقول الإدخال ===== */
  .form-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    align-items: flex-end;
    background: #f8f9fc;
    padding: 18px;
    border-radius: 12px;
    border: 1px solid #eef0f5;
    transition: all 0.3s ease;
  }
  
  .form-row.editing {
    background: #fff3e0;
    border-color: #ff9800;
  }

  .field { flex: 1; min-width: 130px; position: relative; }
  label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    color: #333;
    font-weight: 700;
  }
  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
    transition: all 0.2s;
    background: #fff;
  }
  input[type="text"]:focus, input[type="number"]:focus {
    outline: none;
    border-color: #4c9a2a;
    box-shadow: 0 0 0 3px rgba(76, 154, 42, 0.15);
  }
  button {
    padding: 11px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    transition: all 0.2s;
  }
  .btn-add {
    background: #4c9a2a;
    color: #fff;
    box-shadow: 0 4px 12px rgba(76, 154, 42, 0.3);
  }
  .btn-add:hover { background: #3d7a22; transform: translateY(-2px); }
  
  .btn-update {
    background: #ff9800;
    color: #fff;
    box-shadow: 0 4px 12px rgba(255, 152, 0, 0.3);
  }
  .btn-update:hover { background: #e68a00; transform: translateY(-2px); }

  .btn-cancel-edit {
    background: #95a5a6;
    color: #fff;
  }
  .btn-cancel-edit:hover { background: #7f8c8d; }

  .btn-del {
    background: #ffe5e5;
    color: #d32f2f;
    padding: 6px 10px;
    font-size: 13px;
  }
  .btn-del:hover { background: #d32f2f; color: #fff; }

  .btn-edit {
    background: #e3f2fd;
    color: #1976d2;
    padding: 6px 10px;
    font-size: 13px;
  }
  .btn-edit:hover { background: #1976d2; color: #fff; }

  /* ===== قائمة الاقتراحات ===== */
  .suggestions {
    position: absolute;
    top: 100%;
    right: 0;
    left: 0;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    max-height: 220px;
    overflow-y: auto;
    z-index: 100;
    display: none;
    margin-top: 4px;
  }
  .suggestions.show { display: block; }
  .suggestion-item {
    padding: 10px 14px;
    cursor: pointer;
    font-size: 14px;
    border-bottom: 1px solid #f0f0f0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .suggestion-item:last-child { border-bottom: none; }
  .suggestion-item:hover, .suggestion-item.active {
    background: #f0f7ec;
  }
  .suggestion-item .price-tag {
    font-size: 12px;
    color: #4c9a2a;
    font-weight: 600;
  }
  .suggestions .no-result {
    padding: 12px;
    text-align: center;
    color: #999;
    font-size: 13px;
  }

  /* ===== الجدول ===== */
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
  }
  th, td {
    padding: 12px 10px;
    text-align: center;
    border-bottom: 1px solid #eef0f5;
    font-size: 14px;
  }
  th {
    background: #1e5631;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
  }
  tbody tr:nth-child(even) { background: #fafbff; }
  tbody tr:hover { background: #f0f7ec; }

  .empty {
    text-align: center;
    color: #999;
    padding: 25px;
    font-style: italic;
  }

  /* ===== الإجماليات ===== */
  .totals {
    margin-top: 25px;
    display: flex;
    justify-content: flex-end;
  }
  .totals-box {
    width: 100%;
    max-width: 380px;
    background: #f4f9f4;
    border-radius: 12px;
    padding: 18px 22px;
    border: 1px solid #c4dfb7;
  }
  .totals-row {
    display: flex;
    justify-content: space-between;
    padding: 9px 0;
    font-size: 15px;
    color: #444;
  }
  .totals-row.grand {
    border-top: 2px solid #1e5631;
    margin-top: 8px;
    padding-top: 14px;
    font-size: 19px;
    font-weight: bold;
    color: #d32f2f;
  }

  /* ===== أزرار التحكم ===== */
  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px dashed #ddd;
    flex-wrap: wrap;
  }
  
  .btn-save-pdf {
    background: #27ae60;
    color: #fff;
    box-shadow: 0 4px 12px rgba(39, 174, 96, 0.35);
  }
  .btn-save-pdf:hover { background: #219653; transform: translateY(-2px); }

  .btn-clear {
    background: #ecf0f1;
    color: #555;
  }
  .btn-clear:hover { background: #dfe6e9; }

  /* ========================================================
     إعدادات الطباعة (لإخراج ملف PDF نظيف)
     ======================================================== */
  @page {
    size: A4 portrait;
    margin: 10mm 5mm 15mm 5mm;
  }

  @media print {
    body {
      background: #fff !important;
      padding: 0;
      margin: 0;
      display: block;
      font-size: 12px;
    }
    .container {
      box-shadow: none;
      border-radius: 0;
      padding: 0;
      max-width: 100%;
      background: #fff !important;
    }
    
    .no-print, .form-row, .invoice-statement-row, .actions, .suggestions, th:last-child, td:last-child { 
      display: none !important; 
    }

    .statement-print-text { 
      display: block !important; 
      padding: 4px;
      font-size: 11px;
      margin-bottom: 8px;
      border: none;
      background: transparent;
    }

    .invoice-header {
      padding-bottom: 5px;
      margin-bottom: 8px;
    }
    .header-logo img {
      max-width: 90px;
    }
    .header-title h1 { font-size: 20px; margin-bottom: 2px; }
    .header-title h2 { font-size: 14px; }
    
    .invoice-meta {
      padding: 4px 8px;
      font-size: 11px;
      margin-bottom: 8px;
      border: 1px solid #ccc;
      background: #fafafa !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    table {
      margin-top: 5px;
    }
    th, td {
      padding: 5px 2px !important;
      font-size: 11px !important;
      line-height: 1.2;
      border: 1px solid #ccc;
    }
    th {
      background: #f0f0f0 !important;
      color: #000 !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    
    .totals { margin-top: 8px; page-break-inside: avoid; }
    .totals-box {
      padding: 6px 10px;
      background: #fafafa !important;
      border: 1px solid #ccc;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .totals-row.grand {
      padding-top: 5px;
      font-size: 14px;
      border-top: 1px solid #ccc;
    }
  }
</style>
</head>
<body>

<div class="container">
  <!-- رأس الفاتورة -->
  <div class="invoice-header">
    <div class="header-logo">
      <img src="logo.png" alt="شعار متاجر الوطن" onerror="this.style.display='none'">
    </div>
    
    <div class="header-title">
      <h1>فواتير مشتريات</h1>
      <h2>الخضار</h2>
    </div>

    <div class="header-spacer"></div>
  </div>

  <!-- معلومات الفاتورة -->
  <div class="invoice-meta">
    <div>
      <strong>رقم الفاتورة:</strong> 
      <span id="invoiceNo"></span>
    </div>
    <div><strong>التاريخ:</strong> <span id="invoiceDate"></span></div>
  </div>

  <!-- حقل البيان للإدخال -->
  <div class="invoice-statement-row no-print" id="statementRow">
    <label>البيان:</label>
    <input type="text" id="invoiceStatement" placeholder="اكتب بيان الفاتورة هنا..." autocomplete="off">
  </div>

  <!-- نص البيان للطباعة -->
  <div class="statement-print-text" id="statementPrintBox">
    <strong>البيان:</strong> <span id="statementPrintText"></span>
  </div>

  <!-- إدخال الصنف -->
  <div class="form-row no-print" id="formRow">
    <div class="field" style="flex:2">
      <label>اسم الصنف</label>
      <input type="text" id="itemName" placeholder="اسم الصنف..." autocomplete="off">
      <div class="suggestions" id="suggestions"></div>
    </div>
    <div class="field">
      <label>الكمية</label>
      <input type="number" id="itemQty" min="1" value="1">
    </div>
    <div class="field">
      <label>سعر الوحدة</label>
      <input type="number" id="itemPrice" min="0" step="0.01" placeholder="0.00">
    </div>
    
    <button class="btn-add" id="btnSubmit" onclick="submitItem()">➕ إضافة صنف</button>
    <button class="btn-cancel-edit" id="btnCancelEdit" onclick="cancelEdit()" style="display: none;">إلغاء التعديل</button>
  </div>

  <!-- الجدول -->
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>اسم الصنف</th>
        <th>الكمية</th>
        <th>سعر الوحدة</th>
        <th>الإجمالي</th>
        <th class="no-print">إجراءات</th>
      </tr>
    </thead>
    <tbody id="itemsBody">
      <tr><td colspan="6" class="empty">لا توجد أصناف بعد</td></tr>
    </tbody>
  </table>

  <!-- الإجماليات -->
  <div class="totals">
    <div class="totals-box">
      <div class="totals-row grand">
        <span>الإجمالي النهائي:</span>
        <span id="grandTotal">0.00 ر.س</span>
      </div>
    </div>
  </div>

  <!-- الأزرار -->
  <div class="actions no-print">
    <button class="btn-clear" id="btnClear" onclick="clearCurrentInvoice()">🗑 إلغاء الفاتورة الحالية</button>
    <button class="btn-save-pdf" onclick="savePDFAndStartNew()">💾 حفظ كـ PDF وبدء فاتورة جديدة</button>
  </div>
</div>

<script>
  let savedItems = JSON.parse(localStorage.getItem('savedItems') || '{}');
  let currentItems = [];
  let editIndex = -1;

  const nameInput = document.getElementById('itemName');
  const qtyInput = document.getElementById('itemQty');
  const priceInput = document.getElementById('itemPrice');
  const suggestionsBox = document.getElementById('suggestions');
  const formRow = document.getElementById('formRow');
  const btnSubmit = document.getElementById('btnSubmit');
  const btnCancelEdit = document.getElementById('btnCancelEdit');
  let activeIndex = -1;

  function generateInvoiceNo() {
    return 'INV-' + Date.now().toString().slice(-6);
  }

  function initNewInvoice() {
    document.getElementById('invoiceNo').textContent = generateInvoiceNo();
    document.getElementById('invoiceDate').textContent = new Date().toLocaleDateString('ar-SA');
    document.getElementById('invoiceStatement').value = '';
    currentItems = [];
    cancelEdit();
    render();
    nameInput.focus();
  }

  function editItem(index) {
    editIndex = index;
    const item = currentItems[index];
    
    nameInput.value = item.name;
    qtyInput.value = item.qty;
    priceInput.value = item.price;
    
    formRow.classList.add('editing');
    btnSubmit.textContent = '✔ تحديث الصنف';
    btnSubmit.className = 'btn-update';
    btnCancelEdit.style.display = 'inline-block';
    
    nameInput.focus();
  }

  function cancelEdit() {
    editIndex = -1;
    nameInput.value = '';
    qtyInput.value = 1;
    priceInput.value = '';
    
    formRow.classList.remove('editing');
    btnSubmit.textContent = '➕ إضافة صنف';
    btnSubmit.className = 'btn-add';
    btnCancelEdit.style.display = 'none';
    
    nameInput.focus();
  }

  function submitItem() {
    const name  = nameInput.value.trim();
    const qty   = parseFloat(qtyInput.value);
    const price = parseFloat(priceInput.value);

    if (!name)         return alert('الرجاء إدخال اسم الصنف');
    if (!qty || qty <= 0)     return alert('الرجاء إدخال كمية صحيحة');
    if (isNaN(price) || price < 0) return alert('الرجاء إدخال سعر صحيح');

    if (editIndex === -1) {
      const isDuplicate = currentItems.some(item => item.name === name);
      if (isDuplicate) {
        alert('عذراً، هذا الصنف موجود بالفعل في الفاتورة! يمكنك تعديله من الجدول.');
        return;
      }
    } else {
      const isDuplicate = currentItems.some((item, i) => item.name === name && i !== editIndex);
      if (isDuplicate) {
        alert('عذراً، يوجد صنف آخر بنفس الاسم في الفاتورة!');
        return;
      }
    }

    savedItems[name] = price;
    localStorage.setItem('savedItems', JSON.stringify(savedItems));

    if (editIndex === -1) {
      currentItems.push({ name, qty, price });
    } else {
      currentItems[editIndex] = { name, qty, price };
    }

    cancelEdit();
    render();
  }

  nameInput.addEventListener('keydown', (e) => {
    const list = suggestionsBox.querySelectorAll('.suggestion-item');
    const isDropdownOpen = suggestionsBox.classList.contains('show') && list.length > 0;

    if (e.key === 'ArrowDown') {
      if (!isDropdownOpen) return;
      e.preventDefault();
      activeIndex = (activeIndex + 1) % list.length;
      updateActive(list);
    } else if (e.key === 'ArrowUp') {
      if (!isDropdownOpen) return;
      e.preventDefault();
      activeIndex = (activeIndex - 1 + list.length) % list.length;
      updateActive(list);
    } else if (e.key === 'Enter') {
      if (isDropdownOpen && activeIndex >= 0) {
        e.preventDefault();
        list[activeIndex].click();
      } else {
        e.preventDefault();
        suggestionsBox.classList.remove('show');
        qtyInput.focus();
        qtyInput.select();
      }
    } else if (e.key === 'Escape') {
      suggestionsBox.classList.remove('show');
    }
  });

  qtyInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      priceInput.focus();
      priceInput.select();
    }
  });

  priceInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      submitItem();
    }
  });

  nameInput.addEventListener('input', () => {
    const query = nameInput.value.trim();
    suggestionsBox.innerHTML = '';
    activeIndex = -1;

    if (query.length < 1) {
      suggestionsBox.classList.remove('show');
      return;
    }

    const matches = Object.keys(savedItems).filter(name => name.includes(query)).slice(0, 8);

    if (matches.length === 0) {
      suggestionsBox.innerHTML = '<div class="no-result">لا توجد أصناف محفوظة مطابقة</div>';
      suggestionsBox.classList.add('show');
      return;
    }

    matches.forEach(name => {
      const div = document.createElement('div');
      div.className = 'suggestion-item';
      div.innerHTML = `<span>${name}</span><span class="price-tag">${savedItems[name].toFixed(2)} ر.س</span>`;
      div.onclick = () => selectSuggestion(name);
      suggestionsBox.appendChild(div);
    });
    suggestionsBox.classList.add('show');
  });

  function updateActive(list) {
    list.forEach((el, i) => el.classList.toggle('active', i === activeIndex));
  }

  function selectSuggestion(name) {
    nameInput.value = name;
    if (savedItems[name] !== undefined) {
      priceInput.value = savedItems[name];
    }
    suggestionsBox.classList.remove('show');
    qtyInput.focus();
    qtyInput.select();
  }

  document.addEventListener('click', (e) => {
    if (!nameInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
      suggestionsBox.classList.remove('show');
    }
  });

  function removeItem(index) {
    if (editIndex === index) cancelEdit();
    currentItems.splice(index, 1);
    render();
  }

  function clearCurrentInvoice() {
    if (!confirm('هل أنت متأكد من إلغاء هذه الفاتورة ومسح بياناتها بالكامل؟')) return;
    initNewInvoice();
  }

  /* ========== حفظ كـ PDF وبدء فاتورة جديدة ========== */
  function savePDFAndStartNew() {
    if (currentItems.length === 0) {
      alert('الفاتورة فارغة! يرجى إضافة أصناف أولاً.');
      return;
    }

    const statementVal = document.getElementById('invoiceStatement').value.trim();
    const printBox = document.getElementById('statementPrintBox');
    const printText = document.getElementById('statementPrintText');
    
    if (statementVal) {
      printText.textContent = statementVal;
      printBox.style.display = 'block';
    } else {
      printBox.style.display = 'none';
    }

    window.print();

    setTimeout(() => {
      initNewInvoice();
    }, 500);
  }

  function render() {
    const tbody = document.getElementById('itemsBody');
    tbody.innerHTML = '';

    if (currentItems.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty">لا توجد أصناف بعد</td></tr>';
    } else {
      currentItems.forEach((item, i) => {
        const lineTotal = item.qty * item.price;
        tbody.innerHTML += `
          <tr>
            <td>${i + 1}</td>
            <td>${item.name}</td>
            <td>${item.qty}</td>
            <td>${item.price.toFixed(2)}</td>
            <td>${lineTotal.toFixed(2)}</td>
            <td class="no-print" style="white-space: nowrap;">
              <button class="btn-edit" onclick="editItem(${i})">✏ تعديل</button>
              <button class="btn-del" onclick="removeItem(${i})">🗑</button>
            </td>
          </tr>
        `;
      });
    }

    const grand = currentItems.reduce((sum, it) => sum + it.qty * it.price, 0);

    document.getElementById('grandTotal').textContent = grand.toFixed(2) + ' ر.س';
  }

  qtyInput.addEventListener('focus', function() { this.select(); });
  priceInput.addEventListener('focus', function() { this.select(); });

  initNewInvoice();
</script>

</body>
</html>
